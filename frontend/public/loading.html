<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7D91AD">
  <title>Koruna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Gradient je na html i body a výška je 100dvh, jinak dole (pod home indikátorem) prosvitne bílá */
    html { height: 100%; background: #EEF1F6; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(180deg, #7D91AD 0%, #B9C5D6 45%, #EEF1F6 100%) no-repeat;
      background-size: 100% 100%;
      color: #121A2B; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .mark { width: 96px; height: 96px; padding: 16px; border-radius: 25%; color: #fff;
            background: linear-gradient(160deg, #4F86F7, #1F4FC4);
            box-shadow: 0 10px 28px rgba(47, 107, 234, 0.3); animation: pulse 1.8s ease-in-out infinite; }
    .mark svg { width: 100%; height: 100%; display: block; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
    p { font-size: 14px; color: #5B6880; margin-top: -14px; }
    .bar { width: 120px; height: 4px; border-radius: 4px; background: rgba(47, 107, 234, 0.12); overflow: hidden; }
    .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 4px; background: #2F6BEA;
                  animation: slide 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><path fill="currentColor" d="M46 159A41 41 0 0 1 128 159V255A41 41 0 0 1 46 255ZM159 78A41 41 0 0 1 241 78V255A41 41 0 0 1 159 255ZM272 159A41 41 0 0 1 354 159V255A41 41 0 0 1 272 255ZM56 310H344A27 27 0 0 1 344 364H56A27 27 0 0 1 56 310Z"/></svg></div>
  <h1>Koruna</h1>
  <p>Probouzím server…</p>
  <div class="bar"></div>
  <script>
    // Server se po delší pauze startuje od nuly. Dokud neodpoví, ukazujeme tuhle
    // stránku a pak se na stejné adrese načte skutečná aplikace.
    if (location.pathname !== '/loading.html') (function poll() {
      fetch(location.href, { cache: 'no-store', headers: { 'X-Splash-Probe': '1' } })
        .then(function (r) { if (r.ok) location.reload(); else setTimeout(poll, 1500); })
        .catch(function () { setTimeout(poll, 1500); });
    })();
  </script>
</body>
</html>
