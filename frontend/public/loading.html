<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b3b54">
  <title>Koruna</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background: linear-gradient(160deg, #3a4d6b 0%, #2b3b54 100%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      body { background: linear-gradient(160deg, #f4f6fb 0%, #e3e9f4 100%); color: #1f2b3f; }
    }
    .mark { width: 84px; height: 84px; padding: 16px; border-radius: 24px; background: #2f6bea; color: #fff;
            box-shadow: 0 10px 30px rgba(47, 107, 234, 0.35); animation: pulse 1.8s ease-in-out infinite; }
    .mark svg { width: 100%; height: 100%; display: block; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
    p { font-size: 13px; opacity: 0.65; margin-top: -14px; }
    .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(127, 140, 160, 0.3); overflow: hidden; }
    .bar::after { content: ''; display: block; width: 40%; height: 100%; border-radius: 3px; background: #2f6bea;
                  animation: slide 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.05); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><path fill="currentColor" d="M46 159A41 41 0 0 1 128 159V255A41 41 0 0 1 46 255ZM159 78A41 41 0 0 1 241 78V255A41 41 0 0 1 159 255ZM272 159A41 41 0 0 1 354 159V255A41 41 0 0 1 272 255ZM56 310H344A27 27 0 0 1 344 364H56A27 27 0 0 1 56 310Z"/></svg></div>
  <h1>Koruna</h1>
  <p>Probouzím server…</p>
  <div class="bar"></div>
  <script>
    // Server se po delší pauze startuje od nuly. Dokud neodpoví, ukazujeme tuhle
    // stránku a pak se na stejné adrese načte skutečná aplikace.
    if (location.pathname !== '/loading.html') (function poll() {
      fetch(location.href, { cache: 'no-store', headers: { 'X-Splash-Probe': '1' } })
        .then(function (r) { if (r.ok) location.reload(); else setTimeout(poll, 1500); })
        .catch(function () { setTimeout(poll, 1500); });
    })();
  </script>
</body>
</html>
